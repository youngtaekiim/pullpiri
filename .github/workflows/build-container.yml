name: Build and Push Container Images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  packages: write

env:
  ContainerRegistry: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image repository to lowercase
        id: normalize-image
        shell: bash
        run: |
          image_repo="${IMAGE_NAME,,}"
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image (server + player)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TARGETARCH
          tags: |
            ${{ env.ContainerRegistry }}/${{ steps.normalize-image.outputs.image_repo }}:${{ github.ref_name }}
            ${{ env.ContainerRegistry }}/${{ steps.normalize-image.outputs.image_repo }}:latest
