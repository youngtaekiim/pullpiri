[package]
name = "nodeagent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
tarpaulin_include = []

[dependencies]
tonic = "0.12.3"
tokio = { version = "1.43.1", features = ["full"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9"
clap = { version = "4.5.47", features = ["derive"] }
futures = "0.3.31"
bytes = "1.10.1"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.18", features = ["client", "client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9.1", features = ["client"] }
thiserror = "1.0"
once_cell = "1.19.0"
sysinfo = "0.36.1"
if-addrs = "0.14.0"
hostname = "0.3.1"

[dependencies.common]
path = "../../common"
